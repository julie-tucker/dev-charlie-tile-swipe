<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile Swipe – Concept</title>

    <!-- bootstrap, css, etc -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">

  </head>
  <body>
    <!-- nav bar -->
    <nav class="navbar navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="../index.html">
          <i class="bi bi-grid-3x3-gap-fill"></i> Tile Swipe
        </a>
        <div>
          <a href="concept.html" class="btn btn-sm btn-outline-light me-2">Concept</a>
          <a href="full.html" class="btn btn-sm btn-outline-light">Full Game</a>
        </div>
      </div>
    </nav>

    <main class="container my-4">

      <h1 class="mb-3">Concept Version</h1>

      <!--entering name; selects random guest name if left blank-->
      <div class="mb-4" id="name-section">
        <label for="player-name" class="form-label">Enter your name:</label>
        <div class="input-group" style="max-width: 320px;">
          <input type="text" id="player-name" class="form-control" placeholder="Leave blank for guest">
          <button id="start-btn" class="btn btn-primary">Start Game</button>
        </div>
      </div>


      <!--greeting and score; hidden until name is entered-->
      <div id="game-info" class="mb-3" style="display: none;">
        <p id="greeting" class="mb-1"></p>
        <p>Score: <span id="score">0</span></p>
      </div>

      <!-- Game Board -->
      <div id="game-board" class="mb-4"></div>

      <!-- Controls; up down left right -->
      <div id="controls" style="display: none;">
        <button id="reset-btn" class="btn btn-success me-2">Reset</button>
        <div class="mt-3">
          <button class="btn btn-outline-secondary me-1" data-dir="up">↑</button><br>
          <button class="btn btn-outline-secondary me-1" data-dir="left">←</button>
          <button class="btn btn-outline-secondary me-1" data-dir="down">↓</button>
          <button class="btn btn-outline-secondary" data-dir="right">→</button>
        </div>
      </div>


<!--leaderboard -->
<section class="leaderboard mt-5 mb-4" aria-labelledby="leaderboard-title">
  <div class="leaderboard-header">
    <i class="bi bi-trophy-fill"></i>
    <h2 id="leaderboard-title">Leaderboard</h2>
  </div>

  <p class="leaderboard-subtitle">
    Best scores and top players.
  </p>

  <div class="best-score">
    <span>Best Score</span>
    <strong id="best-score">0</strong>
  </div>

  <h3 class="top-scores-title">Top 5 Scores</h3>

  <ol id="leaderboard-list" class="leaderboard-list">
    <li class="leaderboard-empty">
      Finish a game to make the leaderboard!
    </li>
  </ol>
</section>

    </main>

    <!--footer plus links to repo and github -->
    <footer class="text-center text-muted py-4">
      <p>
        <a href="https://github.com/julie-tucker/dev-charlie-tile-swipe" target="_blank">
          <i class="bi bi-github"></i> Game Repo
        </a>
        &nbsp;·&nbsp;
        <a href="https://github.com/julie-tucker" target="_blank">
          <i class="bi bi-github"></i> My GitHub
        </a>
      </p>

      <!-- bootstrap for alert -->
<div class="modal fade" id="gameModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Game Over</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="modalMessage"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<!-- bootstrap js and concept.js -->
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <!-- link to concept.js -->
      <script src="../assets/js/concept.js"></script>

  </body>
</html>
